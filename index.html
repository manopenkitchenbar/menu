.tabs button small{display:block;font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:none;opacity:.85;margin-top:3px}

<script>
/* Mở thẳng menu Late hour bằng link .../menu/#late; không ghi rõ thì tự chọn Late hour từ 23h đến 3h sáng (giờ Việt Nam) */
(function(){
  var tM=document.getElementById('tMain'),tL=document.getElementById('tLate'),pM=document.getElementById('pMain'),pL=document.getElementById('pLate');
  function chon(late,giuViTri){
    tM.classList.toggle('on',!late);tL.classList.toggle('on',late);pM.hidden=late;pL.hidden=!late;
    try{history.replaceState(null,'',late?'#late':location.pathname+location.search);}catch(e){}
    if(!giuViTri)window.scrollTo(0,0);
  }
  tM.onclick=function(){chon(false);};tL.onclick=function(){chon(true);};
  var gio=+new Intl.DateTimeFormat('en-GB',{hour:'numeric',hour12:false,timeZone:'Asia/Ho_Chi_Minh'}).format(new Date());
  var late=location.hash==='#late'||(location.hash!=='#main'&&(gio>=23||gio<3));
  chon(late,true);
})();
</script>
